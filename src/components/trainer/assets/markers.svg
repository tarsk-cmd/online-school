  <g id="trStar">
    <path d="M20 6.5l4.1 8.6 9.4 1.2-6.9 6.5 1.8 9.3L20 27.6l-8.4 4.5 1.8-9.3-6.9-6.5 9.4-1.2z" stroke-linejoin="round"/>
  </g>
